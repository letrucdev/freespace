name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 1.2.3) — leave empty to use build.ps1 default'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ('${{ github.event.inputs.version }}') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = ''
          }
          if ($v) {
            $parts = $v -split '\.'
            while ($parts.Count -lt 4) { $parts += '0' }
            $v = ($parts[0..3] -join '.')
          }
          "version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($env:GITHUB_REF -replace '^refs/tags/', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: '$v'"

      - name: Install ps2exe
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Force -Scope CurrentUser
          Import-Module ps2exe
          (Get-Module ps2exe).Version

      - name: Build EXE
        shell: pwsh
        run: |
          $args = @{}
          if ('${{ steps.version.outputs.version }}') {
            $args['Version'] = '${{ steps.version.outputs.version }}'
          }
          .\build.ps1 @args

      - name: Show file info
        shell: pwsh
        run: |
          Get-Item .\FreeSpace.exe | Format-List Name, Length, LastWriteTime
          (Get-Item .\FreeSpace.exe).VersionInfo | Format-List FileVersion, ProductName, CompanyName, FileDescription

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeSpace-exe
          path: FreeSpace.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: FreeSpace.exe
